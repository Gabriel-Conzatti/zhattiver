# Compose base — perfil de produção.
# Em desenvolvimento, sobreponha com compose.dev.yaml.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "60", "1000", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  migrate:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      LYNK_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["flask", "db", "upgrade"]
    restart: "no"
    logging: *default-logging
    networks: [internal]

  api:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      LYNK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "${LYNK_GUNICORN_WORKERS:-3}"
      - --timeout
      - "${LYNK_GUNICORN_TIMEOUT:-60}"
      - --access-logfile
      - "-"
      - --error-logfile
      - "-"
      - --forwarded-allow-ips
      - "*"
      - wsgi:app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  worker:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      LYNK_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app inspect ping -d celery@$${HOSTNAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  scheduler:
    build:
      context: ./backend
    env_file: [.env]
    environment:
      LYNK_ENV: production
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["celery", "-A", "app.jobs.celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: infra/caddy/Dockerfile
    environment:
      LYNK_DOMAIN: ${LYNK_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *default-logging
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
