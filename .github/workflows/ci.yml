name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lynk_test
          POSTGRES_USER: lynk
          POSTGRES_PASSWORD: lynk_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynk -d lynk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LYNK_ENV: testing
      TEST_DATABASE_URL: postgresql+psycopg://lynk:lynk_test_password@localhost:5432/lynk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Validate migrations
        working-directory: backend
        run: flask --app wsgi:app db upgrade
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --fund=false || npm install --no-audit --fund=false
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Vitest
        working-directory: frontend
        run: npm test -- --run

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: docker compose config (prod)
        run: docker compose config >/dev/null
      - name: docker compose config (dev override)
        run: docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null
