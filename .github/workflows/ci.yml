name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lynk_test
          POSTGRES_USER: lynk
          POSTGRES_PASSWORD: lynk_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynk -d lynk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LYNK_ENV: testing
      TEST_DATABASE_URL: postgresql+psycopg://lynk:lynk_test_password@localhost:5432/lynk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Validate migrations
        working-directory: backend
        run: flask --app wsgi:app db upgrade
      - name: Ruff
        working-directory: backend
        run: python -m ruff check .
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --fund=false || npm install --no-audit --fund=false
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Vitest
        working-directory: frontend
        run: npm test -- --run

  e2e:
    name: E2E (PostgreSQL + Redis + Chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lynk_e2e
          POSTGRES_USER: lynk
          POSTGRES_PASSWORD: lynk_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lynk -d lynk_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LYNK_ENV: development
      DATABASE_URL: postgresql+psycopg://lynk:lynk_e2e_password@localhost:5432/lynk_e2e
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      LYNK_SECRET_KEY: e2e-session-secret-not-for-production
      LYNK_CSRF_SECRET: e2e-csrf-secret-not-for-production
      LYNK_E2E_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      LYNK_E2E_PASSWORD: e2e-password-not-for-production
      LYNK_E2E_BASE_URL: http://127.0.0.1:5173
      VITE_API_PROXY: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --fund=false
      - name: Apply migrations and seed isolated E2E data
        working-directory: backend
        run: |
          flask --app wsgi:app db upgrade
          flask --app wsgi:app lynk seed-e2e
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start API and frontend
        run: |
          (cd backend && flask --app wsgi:app run --host 127.0.0.1 --port 5000 > ../api-e2e.log 2>&1) &
          (cd frontend && npm run dev -- --host 127.0.0.1 > ../frontend-e2e.log 2>&1) &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5000/api/v1/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api-e2e.log
          cat frontend-e2e.log
          exit 1
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            api-e2e.log
            frontend-e2e.log
            frontend/test-results/
            frontend/playwright-report/

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: docker compose config (prod)
        run: docker compose config >/dev/null
      - name: docker compose config (dev override)
        run: docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null
